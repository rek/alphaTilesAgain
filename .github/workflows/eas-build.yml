name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: eng
        type: choice
        options:
          - eng
          - yue
      submit:
        description: Submit to Google Play (internal track, draft) when the build finishes (main only)
        required: true
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: EAS Build (${{ github.event.inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      # A submit consumes a Play versionCode: only from main, never a feature branch.
      - name: Guard submit to main
        if: ${{ github.event.inputs.submit == 'true' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::submit is only allowed from main (got $GITHUB_REF)"
          exit 1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        working-directory: apps/alphaTiles
        env:
          APP_LANG: ${{ github.event.inputs.profile }}
          PROFILE: ${{ github.event.inputs.profile }}
          SUBMIT_INPUT: ${{ github.event.inputs.submit }}
        run: |
          SUBMIT=""
          if [ "$SUBMIT_INPUT" = "true" ]; then
            SUBMIT="--auto-submit-with-profile=$PROFILE"
          fi
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait $SUBMIT
